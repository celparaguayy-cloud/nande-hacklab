name: Compilar APK de ÑANDE Hacklab

# Manual: se corre desde la pestaña Actions → "Compilar APK…" → Run workflow.
# Está aislado del despliegue a Pages, así que nunca lo rompe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 7 compila el módulo de Android contra Java 21, así que el
      # JDK que compila también tiene que ser 21 (con 17 falla:
      # "invalid source release: 21").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Compilar la web
        run: npm run build

      # Capacitor: instala el runtime (versiones PINEADAS de la misma línea
      # mayor, para que no se cuele un salto de versión que rompa el build),
      # agrega la plataforma Android sólo si no existe, y sincroniza la web.
      - name: Preparar proyecto Android (Capacitor)
        run: |
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@^7.4.0 \
            @capacitor/cli@^7.4.0 \
            @capacitor/android@^7.4.0
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compilar APK de depuración
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nande-hacklab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
